<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <title>Journeyman</title>
  <!-- Small-size variant of Journeyman.svg, redrawn rather than scaled: at
       16px the master's stroke weight fills in the hook and the spark's
       points disappear. Here the stroke is proportionally lighter, the hook
       radius larger, and the spark is a simple 4-point star on whole-pixel
       coordinates so it survives rasterisation. -->
  <g fill="none" stroke="currentColor" color="#B8860B"
     stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M 10 7 L 10 10"/>
    <path d="M 10 10 A 3.5 3.5 0 0 1 3 10"/>
  </g>
  <path d="M 10 0.5 L 11.2 3.8 L 14.5 5 L 11.2 6.2 L 10 9.5 L 8.8 6.2 L 5.5 5 L 8.8 3.8 Z"
        fill="currentColor" color="#B8860B"/>
</svg>
